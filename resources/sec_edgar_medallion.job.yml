resources:
  jobs:
    sec_edgar_medallion_silver_gold:
      name: ${var.job_name}
      description: >-
        SEC EDGAR medallion pipeline: bronze JSON to silver company facts and gold
        financial statements/KPIs with audit, data quality, and reproducible snapshot lineage.
      timeout_seconds: 7200
      max_concurrent_runs: 1
      queue:
        enabled: true
      email_notifications:
        on_failure:
          - ${var.notification_email}
        on_duration_warning_threshold_exceeded:
          - ${var.notification_email}
        no_alert_for_skipped_runs: true
      health:
        rules:
          - metric: RUN_DURATION_SECONDS
            op: GREATER_THAN
            value: 3600
      tags:
        project: sec_edgar
        owner: reynadalman.flores@gmail.com
        layers: silver_gold
        deployed_by: bundle
      schedule:
        quartz_cron_expression: ${var.job_schedule}
        timezone_id: ${var.schedule_timezone}
        pause_status: ${var.pause_status}
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: silver_schema
          default: ${var.silver_schema}
        - name: gold_schema
          default: ${var.gold_schema}
        - name: bronze_path
          default: ${var.bronze_path}
        - name: silver_location
          default: ${var.silver_location}
        - name: gold_location
          default: ${var.gold_location}
        - name: full_refresh
          default: ${var.full_refresh}
      tasks:
        - task_key: silver_company_facts
          description: >-
            Build sec_edgar.silver from bronze with manifest-based incrementality,
            schema drift logging, quarantine, and audit runs.
          notebook_task:
            notebook_path: ../silver_usa.ipynb
            source: WORKSPACE
            base_parameters:
              bronze_path: '{{job.parameters.bronze_path}}'
              silver_location: '{{job.parameters.silver_location}}'
              catalog: '{{job.parameters.catalog}}'
              schema: '{{job.parameters.silver_schema}}'
              full_refresh: '{{job.parameters.full_refresh}}'
          timeout_seconds: 3600
          max_retries: 2
          min_retry_interval_millis: 120000
          retry_on_timeout: true

        - task_key: gold_company_financials
          depends_on:
            - task_key: silver_company_facts
          description: >-
            Build sec_edgar.gold dimensions, facts, KPI tables, and audit outputs
            from the pinned silver snapshot only after silver succeeds.
          notebook_task:
            notebook_path: ../gold_usa.ipynb
            source: WORKSPACE
            base_parameters:
              catalog: '{{job.parameters.catalog}}'
              silver_schema: '{{job.parameters.silver_schema}}'
              gold_schema: '{{job.parameters.gold_schema}}'
              gold_location: '{{job.parameters.gold_location}}'
          timeout_seconds: 3600
          max_retries: 1
          min_retry_interval_millis: 120000
          retry_on_timeout: false
