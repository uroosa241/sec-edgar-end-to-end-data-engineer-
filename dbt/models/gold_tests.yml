version: 2

sources:
  - name: gold_assertions
    database: "{{ var('catalog') }}"
    schema: "{{ var('gold_schema') }}"
    tables:
      - name: company_financials_annual
        tests:
          - dbt_utils.unique_combination_of_columns:
              arguments:
                combination_of_columns:
                  - cik
                  - fiscal_year
      - name: company_financials_quarterly
        tests:
          - dbt_utils.unique_combination_of_columns:
              arguments:
                combination_of_columns:
                  - cik
                  - fiscal_year
                  - fiscal_quarter
